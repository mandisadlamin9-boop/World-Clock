<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Clock</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.37/moment-timezone-with-data-1970-2030.min.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="live-badge">
          <span class="dot"></span>
          <span class="label">Live</span>
        </div>
        <h1>World Clock</h1>
      </div>

      <select id="city">
        <option value="">Select a city..</option>
        <option value="current">📍 My current location</option>
        <option value="Europe/London">🇬🇧 London</option>
        <option value="America/New_York">🗽 New York</option>
        <option value="Pacific/Auckland">🇳🇿 Auckland</option>
        <option value="Asia/Tokyo">🗾 Tokyo</option>
      </select>

      <div id="cities">
        <div class="city" id="los-angeles">
          <div>
            <div class="city-name-row">
              <span class="city-emoji">🌴</span>
              <h2>Los Angeles</h2>
            </div>
            <div class="date"></div>
          </div>
          <div class="time"></div>
        </div>
        <div class="city" id="paris">
          <div>
            <div class="city-name-row">
              <span class="city-emoji">🗼</span>
              <h2>Paris</h2>
            </div>
            <div class="date"></div>
          </div>
          <div class="time"></div>
        </div>
        <div class="city" id="johannesburg">
          <div>
            <div class="city-name-row">
              <span class="city-emoji">🌍</span>
              <h2>Johannesburg</h2>
            </div>
            <div class="date"></div>
          </div>
          <div class="time"></div>
        </div>
      </div>
    </div>

    <footer>
      Coded with ❤️ by Lihle
      <a
        href="https://github.com/mandisadlamin9-boop/World-Clock"
        target="_blank"
        >open sourced on GitHub</a
      >
    </footer>

    <script src="javascript/index.js"></script>
  </body>
</html>
